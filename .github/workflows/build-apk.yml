name: Build Chinese Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The Android project uses these repositories as Gradle composite builds.
      - name: Check out Miuix
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: main
          path: miuix
          fetch-depth: 1

      - name: Check out AndroidLiquidGlass
        uses: actions/checkout@v4
        with:
          repository: Kyant0/AndroidLiquidGlass
          ref: kmp
          path: AndroidLiquidGlass
          fetch-depth: 1

      - name: Align composite build plugin versions
        run: sed -i -E 's/^agp = ".*"$/agp = "9.3.1"/' AndroidLiquidGlass/gradle/libs.versions.toml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;35.0.0"

      - name: Reapply Chinese UI translation
        run: python3 scripts/apply_zh_translation.py

      - name: Commit translation updates
        run: |
          if git diff --quiet -- README.md .github app scripts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github app scripts
          git commit -m "chore: sync Chinese UI translation [skip ci]"
          git push

      - name: Build release APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD is not configured"
            exit 1
          }

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned_apk="app/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/app/build/outputs/apk/release/qcom-band-menu-cn-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          rm -f "$unsigned_apk"

      - name: Verify signed APK
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose app/app/build/outputs/apk/release/qcom-band-menu-cn-release.apk

      - name: Read app version
        id: app
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: cn-v${{ steps.app.outputs.version }}-${{ github.run_number }}
          APK: app/app/build/outputs/apk/release/qcom-band-menu-cn-release.apk
        run: |
          title="高通频段管理 v${{ steps.app.outputs.version }}（简体中文 Release）"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "自动构建的已签名 Release APK。需要 Android 11 或更高版本、Qualcomm 设备及 Root 权限。" \
              --latest
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
