name: Initialize Android Release Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Generate persistent release keystore
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail

          test -n "${GH_TOKEN:-}" || {
            echo "::error::BOOTSTRAP_PAT is not configured"
            exit 1
          }

          keystore="$RUNNER_TEMP/release.jks"
          alias="qcom-band-menu"
          store_password="$(openssl rand -hex 24)"
          key_password="$store_password"

          keytool -genkeypair \
            -noprompt \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Qcom Band Menu, OU=Android, O=Personal"

          keystore_base64="$(base64 --wrap=0 "$keystore")"
          gh secret set ANDROID_KEYSTORE_BASE64 \
            --repo "$GITHUB_REPOSITORY" \
            --body "$keystore_base64"
          gh secret set ANDROID_KEYSTORE_PASSWORD \
            --repo "$GITHUB_REPOSITORY" \
            --body "$store_password"
          gh secret set ANDROID_KEY_ALIAS \
            --repo "$GITHUB_REPOSITORY" \
            --body "$alias"
          gh secret set ANDROID_KEY_PASSWORD \
            --repo "$GITHUB_REPOSITORY" \
            --body "$key_password"

          gh secret delete BOOTSTRAP_PAT \
            --repo "$GITHUB_REPOSITORY"

          rm -f "$keystore"
          echo "Release signing secrets initialized."
